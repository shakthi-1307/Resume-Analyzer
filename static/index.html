<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Resume Analyzer</title>
    <!-- Make sure these paths match your folder structure -->
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="glass-container">
      <header>
        <i class="fas fa-robot logo-icon"></i>
        <h1>AI Resume Analyzer</h1>
        <p>Powered by Groq AI - Instant Resume Matching</p>
      </header>

      <div class="input-group">
        <label for="jd"><i class="fas fa-file-alt"></i> Job Description</label>
        <!-- Added rows and fixed z-index issues -->
        <textarea
          id="jd"
          name="jd"
          rows="6"
          placeholder="Paste the job requirements here..."
        ></textarea>
      </div>

      <div class="input-group">
        <label for="resumeFile"
          ><i class="fas fa-cloud-upload-alt"></i> Upload Resume (PDF)</label
        >
        <input type="file" id="resumeFile" accept=".pdf" />
      </div>

      <button id="analyzeBtn" onclick="analyzeResume()">
        <span id="btnText">Analyze Now</span>
        <div id="loader" class="loader hidden"></div>
      </button>

      <div id="resultsArea" class="hidden">
        <div class="divider"></div>
        <div class="score-card">
          <span class="score-label">Match Score</span>
          <div id="matchScore">--%</div>
        </div>
        <div class="analysis-box">
          <h3><i class="fas fa-lightbulb"></i> AI Analysis</h3>
          <div id="aiFeedback"></div>
        </div>
      </div>

      <footer class="disclaimer">
        <p>
          <i class="fas fa-info-circle"></i>
          <strong>Academic Purpose:</strong> This tool was built for academic
          and learning purposes only. It uses Groq's powerful AI for instant analysis.
          Please use at your own risk.
        </p>
      </footer>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
